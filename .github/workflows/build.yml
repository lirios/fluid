name: CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-archlinux:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux
    steps:
      - uses: actions/checkout@v5
      - name: Download dependencies
        run: |
          pacman --noconfirm --noprogressbar -Syyu
          pacman --noconfirm --noprogressbar -Sy \
            base-devel \
            doxygen \
            cmake \
            ninja \
            pkgconf \
            python \
            python-pip \
            qt6-base \
            qt6-declarative \
            qt6-5compat \
            qt6-svg \
            qt6-wayland \
            qt6-shadertools \
            qt6-5compat \
            wayland-protocols \
            wayland
      - name: Install QML documentation filter
        run: |
          python -m venv .venv
          .venv/bin/pip install doxyqml==0.5.3
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake -GNinja -B build -DFLUID_WITH_DOCUMENTATION=ON
          cmake --build build
          cmake --install build
